name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/benscholer.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check routes in the built image
        run: |
          docker run -d --name site -p 8080:8080 site:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080$1"); [ "$code" = "$2" ] || { echo "$1 -> $code, want $2"; exit 1; }; echo "$1 -> $code"; }
          check / 200
          check /halloween-handouts/ 200
          check /signal-retime/ 200
          check /personal/ 301
          check /terrain/meta.json 200
          check /terrain/smith-rock.u16 200
          check /terrain/ortho.jpg 200
          check /no-such-page 404
          curl -fs localhost:8080/ | grep -q 'src="/assets/main-'
          curl -s localhost:8080/no-such-page | grep -q 'Off the map'

  docker:
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # bscholer.github.io only redirects to benscholer.com, keeping the path.
  pages:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Write redirect pages
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Moved to benscholer.com</title>
            <link rel="canonical" href="https://benscholer.com/">
            <meta http-equiv="refresh" content="0; url=https://benscholer.com/">
            <script>location.replace('https://benscholer.com' + location.pathname + location.search + location.hash);</script>
          </head>
          <body><a href="https://benscholer.com/">benscholer.com</a></body>
          </html>
          EOF
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
        id: deploy

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
